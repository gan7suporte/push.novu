# Stack do Novu para o Portainer (baseado em docker/community/docker-compose.yml)
#
# Diferenças em relação ao compose oficial:
# - containers com prefixo "novu-" para não confundir com as outras stacks
# - URLs montadas aqui a partir de NOVU_HOST, pois o Portainer não expande
#   variáveis que referenciam outras variáveis dentro do .env
# - portas internas fixas; só as portas publicadas são configuráveis
name: novu

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-mongo-url: &mongo-url "mongodb://${MONGO_USER:-novu}:${MONGO_PASSWORD:?defina MONGO_PASSWORD}@mongodb:27017/novu-db?authSource=admin"

services:
  redis:
    image: "redis:7-alpine"
    container_name: novu-redis
    restart: unless-stopped
    logging: *logging
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0.17
    container_name: novu-mongodb
    restart: unless-stopped
    logging: *logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-novu}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?defina MONGO_PASSWORD}
    volumes:
      - mongodb:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: "ghcr.io/novuhq/novu/api:${NOVU_VERSION:-3.19.0}"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    container_name: novu-api
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      API_ROOT_URL: ${NOVU_HOST:?defina NOVU_HOST}:${API_PORT:-3000}
      FRONT_BASE_URL: ${NOVU_HOST}:${DASHBOARD_PORT:-4000}
      MONGO_URL: *mongo-url
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      MONGO_AUTO_CREATE_INDEXES: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: ""
      REDIS_CACHE_SERVICE_PORT: 6379
      S3_LOCAL_STACK: ${S3_LOCAL_STACK:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-novu-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      STORE_ENCRYPTION_KEY: ${STORE_ENCRYPTION_KEY:?defina STORE_ENCRYPTION_KEY}
      NOVU_SECRET_KEY: ${NOVU_SECRET_KEY:?defina NOVU_SECRET_KEY}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
      SENTRY_DSN: ""
      NEW_RELIC_ENABLED: "false"
      IS_API_IDEMPOTENCY_ENABLED: "false"
      IS_API_RATE_LIMITING_ENABLED: "false"
      IS_NEW_MESSAGES_API_RESPONSE_ENABLED: "true"
      IS_V2_ENABLED: "true"
      IS_SELF_HOSTED: "true"
    ports:
      - ${API_PORT:-3000}:3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/v1/health-check || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    image: "ghcr.io/novuhq/novu/worker:${NOVU_VERSION:-3.19.0}"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    container_name: novu-worker
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3004
      API_ROOT_URL: http://api:3000
      MONGO_URL: *mongo-url
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB_INDEX: 2
      REDIS_CACHE_SERVICE_HOST: ""
      REDIS_CACHE_SERVICE_PORT: 6379
      S3_LOCAL_STACK: ${S3_LOCAL_STACK:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-novu-local}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      STORE_ENCRYPTION_KEY: ${STORE_ENCRYPTION_KEY}
      SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
      SENTRY_DSN: ""
      NEW_RELIC_ENABLED: "false"
      BROADCAST_QUEUE_CHUNK_SIZE: 100
      MULTICAST_QUEUE_CHUNK_SIZE: 100
      IS_EMAIL_INLINE_CSS_DISABLED: "false"
      IS_USE_MERGED_DIGEST_ID_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3004/v1/health-check || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s

  ws:
    image: "ghcr.io/novuhq/novu/ws:${NOVU_VERSION:-3.19.0}"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    container_name: novu-ws
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3002
      MONGO_URL: *mongo-url
      MONGO_MIN_POOL_SIZE: 5
      MONGO_MAX_POOL_SIZE: 10
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      NEW_RELIC_ENABLED: "false"
    ports:
      - ${WS_PORT:-3002}:3002
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/v1/health-check || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    image: "ghcr.io/novuhq/novu/dashboard:${NOVU_VERSION:-3.19.0}"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    container_name: novu-dashboard
    restart: unless-stopped
    logging: *logging
    environment:
      VITE_API_HOSTNAME: ${NOVU_HOST}:${API_PORT:-3000}
      VITE_WEBSOCKET_HOSTNAME: ${NOVU_HOST}:${WS_PORT:-3002}
    ports:
      - ${DASHBOARD_PORT:-4000}:4000
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get({hostname: ''localhost'', port: 4000, path: ''/'', timeout: 5000}, (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mongodb:
  redis:
